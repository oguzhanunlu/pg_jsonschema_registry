[package]
name = "pg_jsonschema_registry"
version = "0.1.0"
edition = "2021"
license = "PostgreSQL"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.3"
jsonschema = { version = "0.59", default-features = false, features = ["jsonb", "arbitrary-precision"] }
serde_json = "1"

[dependencies.pgrx-bench]
version = "=0.19.3"
optional = true

[dev-dependencies]
postgres = "0.19"
[dev-dependencies.pgrx-tests]
version = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
